[project]
name = "mars-rag"
version = "0.1.0"
description = "Mars mission research assistant: hybrid RAG over NASA Technical Reports Server documents, with citations, declines and RAGAS evaluation"
authors = [
    { name = "Mohammed Saad", email = "59375560+msaad7777@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.0.1",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
mars-rag = "mars_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
eval = [
    "langchain-community==0.4.1",
    "ragas==0.4.3",
]
